# Theme consumer: rendered into every theme build as notifications/dunstrc.theme.
id = "notifications"
template = "notifications/theme-template/dunstrc.theme"
output = "notifications/dunstrc.theme"

# The notifications command defers Dunst's reload while DND is active and
# applies it when DND is turned off, preserving the pause state.
[reload]
kind = "command"
argv = ["argvus", "notifications", "theme", "reload", "${ARGVUS_DATA_HOME}/dunst/dunstrc"]

# Defaults for the tokens the template reads; a theme that defines one wins.
[palette]
danger = "#E06C75"
notify_app_background = "@bg"
notify_critical_background = "@danger"
notify_critical_foreground = "@fg"
notify_low_background = "@bg"
notify_low_foreground = "@fg | mix(@bg, 0.2)"
notify_normal_background = "@bg | mix(@accent, 0.1)"
notify_normal_foreground = "@fg"
